name: Flutter CI

# PR-only: avoids duplicate Actions emails on every push/merge to main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned: Flutter 3.50 deprecates package:flutter/material.dart in
          # favour of package:material_ui, which is a separate migration.
          flutter-version: 3.41.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test

